name: signaltrail-monitoring
services:
  alloy:
    image: grafana/alloy:v1.20.0
    command:
      [
        'run',
        '--server.http.listen-addr=0.0.0.0:12345',
        '--storage.path=/var/lib/alloy/data',
        '/etc/alloy/config.alloy',
      ]
    ports:
      - '127.0.0.1:12345:12345'
    environment:
      SIGNALTRAIL_METRICS_TARGET: ${SIGNALTRAIL_METRICS_TARGET:-host.docker.internal:9464}
      SIGNALTRAIL_REDPANDA_METRICS_TARGET: ${SIGNALTRAIL_REDPANDA_METRICS_TARGET:-redpanda:9644}
      GRAFANA_CLOUD_METRICS_URL: ${GRAFANA_CLOUD_METRICS_URL:?Set the Grafana Cloud Prometheus remote-write URL}
      GRAFANA_CLOUD_METRICS_USER: ${GRAFANA_CLOUD_METRICS_USER:?Set the Grafana Cloud metrics instance ID}
      GRAFANA_CLOUD_METRICS_TOKEN_FILE: /run/secrets/grafana_metrics_token
    secrets:
      - grafana_metrics_token
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - ../../test-results:/etc/alloy/targets:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - default
      - application
    restart: unless-stopped
secrets:
  grafana_metrics_token:
    file: ${GRAFANA_CLOUD_METRICS_TOKEN_PATH:?Set an absolute path to the local metrics token file}
networks:
  application:
    external: true
    name: ${SIGNALTRAIL_APPLICATION_NETWORK:-signaltrail_default}
volumes:
  alloy_data:
