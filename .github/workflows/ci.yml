name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Test load harness cleanup
        run: ./scripts/signaltrail-ops.mjs load check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  browser-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm --filter @signaltrail/browser-sdk exec playwright install --with-deps chromium

      - name: Measure browser SDK bundle sizes
        run: ./scripts/signaltrail-ops.mjs browser size

      - name: Measure native IndexedDB queue performance
        run: ./scripts/signaltrail-ops.mjs browser benchmark

      - name: Test browser SDK in Chromium
        run: ./scripts/signaltrail-ops.mjs browser test

      - name: Upload browser test report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-sdk-chromium
          path: |
            packages/browser-sdk/playwright-report/
            packages/browser-sdk/test-results/
            test-results/sdk-size/
            test-results/queue-benchmark/
          retention-days: 7
          if-no-files-found: ignore

  ingestion-redpanda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start isolated Redpanda
        run: docker compose --project-name signaltrail-ci up -d --wait --wait-timeout 120 redpanda
      - name: Initialize and verify development topic
        run: docker compose --project-name signaltrail-ci run --rm redpanda-init
      - name: Test ingestion against Redpanda
        run: ./scripts/signaltrail-ops.mjs broker test
      - name: Verify bounded publisher under load
        run: ./scripts/signaltrail-ops.mjs load saturation
        env:
          DURATION: 5s
      - name: Verify SDK recovery after broker interruption
        run: ./scripts/signaltrail-ops.mjs load recovery
      - name: Verify slow-upload admission and SDK retry
        run: ./scripts/signaltrail-ops.mjs load request-admission
      - name: Verify sustained processing and measurement artifacts
        run: ./scripts/signaltrail-ops.mjs load sustained-smoke
      - name: Verify project-scoped analytics reads against ClickHouse
        run: ./scripts/signaltrail-ops.mjs load analytics-read
      - name: Verify ClickHouse readiness waits for initialization
        run: ./scripts/signaltrail-ops.mjs load storage-readiness
      - name: Install Chromium for the full pipeline probe
        run: pnpm --filter @signaltrail/browser-sdk exec playwright install --with-deps chromium
      - name: Verify browser persistence, worker recovery, dedupe, and dead-letter commits
        run: ./scripts/signaltrail-ops.mjs load browser-pipeline
      - name: Upload load-test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-load-smoke
          path: test-results/load/
          retention-days: 7
          if-no-files-found: ignore
      - name: Collect broker logs
        if: ${{ always() }}
        run: docker compose --project-name signaltrail-ci logs --no-color redpanda > "${{ runner.temp }}/redpanda.log"
      - name: Upload broker logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-redpanda-logs
          path: ${{ runner.temp }}/redpanda.log
          retention-days: 7
      - name: Remove isolated CI infrastructure
        if: ${{ always() }}
        run: docker compose --project-name signaltrail-ci down --volumes
