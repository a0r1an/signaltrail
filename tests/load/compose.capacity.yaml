services:
  postgres:
    cpuset: '0,1'
    ports: !override
      - '127.0.0.1:34104:4104'
      - '127.0.0.1:34105:4105'
  redpanda:
    cpuset: '0,1'
  clickhouse:
    cpuset: '0,1'
  valkey:
    cpuset: '0,1'
  app:
    cpuset: '0,1'
    environment:
      SIGNALTRAIL_CAPACITY_PROFILE: '1'
      SIGNALTRAIL_FIXTURE_BATCH_WAIT_MS: '${SIGNALTRAIL_FIXTURE_BATCH_WAIT_MS:-0}'
      SIGNALTRAIL_FIXTURE_ASYNC_INSERT: '${SIGNALTRAIL_FIXTURE_ASYNC_INSERT:-0}'
      SIGNALTRAIL_FIXTURE_SEED_PROFILE: '${SIGNALTRAIL_FIXTURE_SEED_PROFILE:-default}'
      SIGNALTRAIL_FIXTURE_HTTP_CAP: '${SIGNALTRAIL_FIXTURE_HTTP_CAP:-128}'
      SIGNALTRAIL_FIXTURE_DB_CONNECTIONS: '${SIGNALTRAIL_FIXTURE_DB_CONNECTIONS:-4}'
      SIGNALTRAIL_FIXTURE_DB_QUERIES: '${SIGNALTRAIL_FIXTURE_DB_QUERIES:-16}'
