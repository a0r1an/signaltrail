name: signaltrail-load
services:
  postgres:
    extends:
      file: ../../compose.yaml
      service: postgres
    profiles: ['metadata']
    ports: !override
      - '127.0.0.1:35433:5432'
  redpanda:
    extends:
      file: ../../compose.yaml
      service: redpanda
    ports: !override
      - '127.0.0.1:29092:29092'
      - '127.0.0.1:29644:9644'
  init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/init/init-topics.sh']
    volumes:
      - ../../infra/redpanda/init-topics.sh:/init/init-topics.sh:ro
    environment:
      REDPANDA_BROKERS: redpanda:9092
  clickhouse:
    extends:
      file: ../../compose.yaml
      service: clickhouse
    profiles: ['storage']
    environment:
      SIGNALTRAIL_STORAGE_INIT_GATE: ${SIGNALTRAIL_STORAGE_INIT_GATE:-0}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ "$${SIGNALTRAIL_STORAGE_INIT_GATE:-0}" = '1' ]; then
          cp /signaltrail-init-gate.sh /docker-entrypoint-initdb.d/999-signaltrail-test-gate.sh
          chmod 0644 /docker-entrypoint-initdb.d/999-signaltrail-test-gate.sh
        fi
        exec /entrypoint.sh
    volumes:
      - ./storage-init-gate.sh:/signaltrail-init-gate.sh:ro
    ports: !override
      - '127.0.0.1:38123:8123'
  k6:
    image: grafana/k6:1.6.0
    profiles: ['tools']
    volumes:
      - ./:/scripts:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  postgres_data:
  redpanda_data:
  clickhouse_data:
